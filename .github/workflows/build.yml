name: Build tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and iOS 15 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bash curl sudo xz-utils make perl git fakeroot
          export THEOS="$HOME/theos"
          gh api repos/theos/theos/contents/bin/install-theos -H "Accept: application/vnd.github.raw" > /tmp/install-theos
          CI=1 bash /tmp/install-theos
          gh repo clone theos/sdks /tmp/sdks -- --depth 1
          find /tmp/sdks -maxdepth 3 -name "iPhoneOS15.6.sdk" -exec cp -rn {} "$THEOS/sdks/" \;
          rm -rf /tmp/sdks /tmp/install-theos

      - name: Build rootless for iOS 15 (iphoneos-arm64)
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:15.6:15.0

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: rootless-ios15-deb
          path: packages/*.deb
