name: Build tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and iOS 15 SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bash curl sudo xz-utils make perl git fakeroot
          export THEOS="$HOME/theos"
          H="github.com"
          R="://githubusercontent.com"
          CI=1 bash -c "$(curl -fsSL https://$R/theos/theos/master/bin/install-theos)"
          git clone --depth 1 "https://$H/theos/sdks.git" /tmp/sdks
          cp -rn /tmp/sdks/iPhoneOS15.6.sdk "$THEOS/sdks/"
          rm -rf /tmp/sdks

      - name: Build rootless for iOS 15 (iphoneos-arm64)
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:15.6:15.0

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: rootless-ios15-deb
          path: packages/*.deb
