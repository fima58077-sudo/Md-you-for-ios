name: Build tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos and iOS 15 SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git perl clang lld llvm make fakeroot
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com "$THEOS"
          git clone --depth 1 https://github.com /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS15.6.sdk "$THEOS/sdks/"
          rm -rf /tmp/sdks

      - name: Build rootless for iOS 15 (iphoneos-arm64)
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:15.6:15.0

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: rootless-ios15-deb
          path: packages/*.deb
