name: Build tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.6

      - name: Build rootless for iOS 15 (iphoneos-arm64)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:15.6:15.0

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: rootless-ios15-deb
          path: packages/*.deb
